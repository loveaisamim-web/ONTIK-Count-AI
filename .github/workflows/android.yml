name: ONTIK Count AI - OpenCV Android CI Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Test & Build Debug APK (JDK 17 / Gradle 8.7 / OpenCV 4.9.0)
    runs-on: ubuntu-latest

